name: Create Release

on: workflow_dispatch

permissions: {}

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

  create_release:
    name: tag
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write # create GitHub release and tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create Release
        uses: SneaksAndData/github-actions/semver_release@42d1e71a9297cc52e824d9405604073a1da7a5cf # v0.1.13
        with:
          major_v: 2
          minor_v: 0
